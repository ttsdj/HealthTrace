services:
  postgres:
    container_name: healthtrace-postgres
    image: postgres:15
    environment:
      POSTGRES_DB: healthtrace
      POSTGRES_USER: postgres
      # Credential comes from .env; the default only covers a fresh volume on
      # a developer machine. Every data-service port is bound to 127.0.0.1 so
      # none of them is reachable from other hosts even if the password is
      # weak. Change POSTGRES_PASSWORD for any shared or remote deployment.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthtrace-local-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthtrace"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    container_name: healthtrace-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-healthtrace-local-dev}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-healthtrace-local-dev}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    container_name: healthtrace-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: healthtrace-milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-healthtrace-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-healthtrace-local-minio}
    ports:
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: healthtrace-milvus-standalone
    image: milvusdb/milvus:v2.5.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESSKEYID: ${MINIO_ROOT_USER:-healthtrace-minio}
      MINIO_SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD:-healthtrace-local-minio}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      - "etcd"
  attu:
    container_name: healthtrace-milvus-attu
    image: zilliz/attu:v2.5.11
    environment:
      - MILVUS_URL=standalone:19530
      - PORT=3000
    ports:
      # Attu has no authentication of its own; keep the console on the
      # loopback interface only.
      - "127.0.0.1:8080:3000"
    depends_on:
      - standalone
    networks:
      - default

networks:
  default:
    name: healthtrace
