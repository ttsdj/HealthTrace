name: HealthTrace CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: python -m pytest -q
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Scan repository safety
        run: python scripts/check_repo_safety.py
      - name: Validate Compose application stack
        run: cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.app.yml config --quiet
