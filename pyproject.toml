[project]
name = "healthtrace"
version = "0.1.0"
description = "HealthTrace personal health record and evidence-grounded consultation workspace."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "HealthTrace Project Team" },
]
dependencies = [
    "rich>=14.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "pymilvus>=2.5.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.8.0",
    "langchain>=0.2.14",
    "langchain-core>=0.2.37",
    "langchain-community>=0.2.12",
    "langchain-text-splitters>=0.2.2",
    "langchain-huggingface>=0.1.0",
    "langchain-openai>=0.1.22",
    "sentence-transformers>=3.0.0",
    "langgraph>=0.2.31",
    "pypdf>=4.3.1",
    "pypdfium2>=4.30.0",
    "docx2txt>=0.8",
    "openpyxl",
    "tabulate",
    "msoffcrypto-tool",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "redis>=5.2.1",
    "neo4j>=5.28.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "beautifulsoup4>=4.12.0",
    "mcp>=1.28.0,<2",
    "ragas>=0.4.3,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
ocr = [
    "paddleocr[doc-parser]>=3.3.0,<4",
    "pillow>=10.4.0",
    "torchvision>=0.27.0,<0.28",
    "unstructured",
    "msoffcrypto-tool",
]
study = [
    "langchain-classic>=0.2.0",
    "chromadb>=0.5.5",
    "bilibili-api-python>=17.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = ["frontend*", "scripts*", "docs*", "data*", "volumes*"]
